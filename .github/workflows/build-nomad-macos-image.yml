name: Build macOS-distribution admin image

# Builds the admin Docker image for the macOS-distribution lineage and
# pushes it to ghcr.io/caweis/project-nomad-macos-arm64. Multi-arch
# (linux/amd64,linux/arm64) so the same image works on Rosetta-backed
# Docker Desktop and arm64-native OrbStack/colima.
#
# Each architecture is built on its OWN native runner — amd64 on ubuntu-latest,
# arm64 on ubuntu-24.04-arm (GitHub-hosted arm64, free for public repos) — and
# pushed by digest. A final merge job stitches the two digests into one
# multi-arch manifest list carrying the real tags. This replaces the old
# single-runner QEMU emulation of arm64, where an uncached base-layer rebuild
# (native module compiles + the Vite bundle, all emulated) took ~an hour and
# could degenerate into a stall.
#
# Triggers:
#   - push to main when admin/, the root Dockerfile, package.json, or this
#     workflow change → image tagged :edge.
#   - tag push matching v* → image tagged :vX.Y.Z and :latest.
#   - workflow_dispatch → manual build, optional :latest promotion.

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**'
      - 'Dockerfile'
      - 'package.json'
      - '.github/workflows/build-nomad-macos-image.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (no "v" prefix, e.g. "1.2.3"). Leave blank for :edge only.'
        required: false
        type: string
        default: ''
      tag_latest:
        description: 'Also tag this image as :latest?'
        required: false
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/project-nomad-macos-arm64

jobs:
  # ── Stage 1: compute the tags + version label once, shared by build + merge ─
  meta:
    name: Compute tags and version
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      version: ${{ steps.tags.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${{ env.IMAGE }}"
          TAGS=""

          # Always include a short-SHA tag for traceability
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS="${IMAGE}:sha-${SHORT_SHA}"

          # Branch pushes → :edge (latest from the dev branch)
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "branch" ]]; then
            TAGS="${TAGS},${IMAGE}:edge"
          fi

          # Release tag pushes → :vX.Y.Z and :latest.
          # Docker image tags only allow [a-zA-Z0-9_.-], but SemVer 2.0 lets us
          # use `+` for build metadata (e.g. v0.1.0-macos+2026.05.11). The git
          # tag stays as-authored; we substitute `+` → `.` for the Docker tag so
          # buildx accepts it (v0.1.0-macos.2026.05.11), still round-trippable.
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            DOCKER_TAG="${TAG_NAME//+/.}"
            TAGS="${TAGS},${IMAGE}:${DOCKER_TAG}"
            TAGS="${TAGS},${IMAGE}:latest"
          fi

          # workflow_dispatch with explicit version (same `+` → `.` substitution)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            INPUT_VERSION="${{ inputs.version }}"
            DOCKER_VERSION="${INPUT_VERSION//+/.}"
            TAGS="${TAGS},${IMAGE}:${DOCKER_VERSION},${IMAGE}:v${DOCKER_VERSION}"
            if [[ "${{ inputs.tag_latest }}" == "true" ]]; then
              TAGS="${TAGS},${IMAGE}:latest"
            fi
          fi

          # workflow_dispatch without version → just :edge
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -z "${{ inputs.version }}" ]]; then
            TAGS="${TAGS},${IMAGE}:edge"
          fi

          # Resolve the human version for the OCI image.version label. On a normal
          # push to main, github.ref_name is just "main" — useless as a version,
          # and it's what made `nomad upgrade` / `nomad build-check` show a build
          # rev with no version. Read the real version from the root package.json
          # (e.g. 0.2.739-macos). A tag push or explicit workflow_dispatch version
          # still takes precedence.
          PKG_VERSION="$(jq -r '.version // ""' package.json 2>/dev/null)"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            IMAGE_VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            IMAGE_VERSION="${{ inputs.version }}"
          elif [[ -n "$PKG_VERSION" ]]; then
            IMAGE_VERSION="$PKG_VERSION"
          else
            IMAGE_VERSION="${{ github.ref_name }}"
          fi
          echo "version=${IMAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version label: ${IMAGE_VERSION}"

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags:"
          echo "${TAGS}" | tr ',' '\n' | sed 's/^/  - /'

  # ── Stage 2: build each arch on its OWN native runner, push by digest ───────
  build:
    name: Build ${{ matrix.platform }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          # Single platform, built NATIVELY on this matrix runner — no QEMU.
          platforms: ${{ matrix.platform }}
          # Per-arch cache scope so the two legs don't clobber each other's cache.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          # Push the single-arch image by DIGEST only (no tags here); the merge
          # job assembles the tagged multi-arch manifest from both digests.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Stage 3: merge the per-arch digests into one tagged multi-arch manifest ─
  merge:
    name: Merge manifest and push tags
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest list with all tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          # `-t <tag>` flags from meta's comma-separated tag list, and the
          # `IMAGE@sha256:<digest>` source refs from each downloaded digest file
          # (named by its digest, sans the sha256: prefix).
          tag_flags=$(echo "${{ needs.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^/--tag /' | tr '\n' ' ')
          sources=$(printf '${{ env.IMAGE }}@sha256:%s ' *)
          echo "Tags: ${{ needs.meta.outputs.tags }}"
          echo "Source digests: $(ls)"
          docker buildx imagetools create $tag_flags $sources

      - name: Inspect the published image
        run: |
          FIRST_TAG=$(echo "${{ needs.meta.outputs.tags }}" | cut -d',' -f1)
          docker buildx imagetools inspect "$FIRST_TAG"
