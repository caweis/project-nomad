name: Validate collection URLs

on:
  push:
    paths:
      - 'collections/**.json'
      - '.github/scripts/check-collection-urls.sh'
      - '.github/scripts/test-check-collection-urls.sh'
      - '.github/scripts/report-collection-urls.sh'
      - '.github/scripts/test-report-collection-urls.sh'
      - '.github/workflows/validate-collection-urls.yml'
  pull_request:
    paths:
      - 'collections/**.json'
      - '.github/scripts/check-collection-urls.sh'
      - '.github/scripts/test-check-collection-urls.sh'
      - '.github/scripts/report-collection-urls.sh'
      - '.github/scripts/test-report-collection-urls.sh'
      - '.github/workflows/validate-collection-urls.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Serialize main's scheduled/manual checks so issue creation and closure cannot race.
concurrency:
  group: catalog-urls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check validator behavior
        run: |
          bash .github/scripts/test-check-collection-urls.sh
          bash .github/scripts/test-report-collection-urls.sh
      - name: Check catalog links
        id: catalog
        run: |
          set -o pipefail
          bash .github/scripts/check-collection-urls.sh collections | tee catalog-urls.log
      - name: Report main catalog status
        if: always() && (steps.catalog.outcome == 'success' || steps.catalog.outcome == 'failure') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATALOG_OUTCOME: ${{ steps.catalog.outcome }}
        run: bash .github/scripts/report-collection-urls.sh "$CATALOG_OUTCOME" catalog-urls.log
