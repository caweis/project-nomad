name: Build Translate Service Image

on:
  pull_request:
    paths:
      - 'install/nomad-translate/**'
      - '.github/workflows/build-translate-service.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version, for example 0.1.0'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run translation tests
        run: python -m unittest discover -s install/nomad-translate -p 'test_*.py' -v
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: install/nomad-translate
          platforms: linux/arm64
          push: false

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check publication authorization
        id: authorization
        run: echo "allowed=${{ contains(secrets.DEPLOYMENT_AUTHORIZED_USERS, github.triggering_actor) }}" >> "$GITHUB_OUTPUT"
      - name: Validate version
        if: steps.authorization.outputs.allowed == 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@v5
        if: steps.authorization.outputs.allowed == 'true'
      - uses: docker/setup-qemu-action@v4
        if: steps.authorization.outputs.allowed == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.authorization.outputs.allowed == 'true'
      - uses: docker/login-action@v4
        if: steps.authorization.outputs.allowed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: steps.authorization.outputs.allowed == 'true'
        with:
          context: install/nomad-translate
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/project-nomad-translate:${{ inputs.version }}
